[project]
name = "linguaquest-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "uvicorn[standard]>=0.38,<1", "sqlalchemy>=2.0.44,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.17,<2", "aiogram>=3.22,<4", "httpx>=0.28,<1", "pydantic-settings>=2.11,<3"]
[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

asyncio_default_fixture_loop_scope = "function"

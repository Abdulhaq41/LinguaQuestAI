limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 64k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org; base-uri 'self'; form-action 'self'" always;
  # Caddy is the only public entrypoint; trust forwarded client IPs only on the private container network.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  location = /api/telegram/webhook {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 40s;
  }
  location /api/ {
    limit_req zone=api burst=50 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 40s;
  }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(woff2|svg|png|webp)$ { expires 7d; try_files $uri =404; }
}
